}

#touch{display:none;justify-content:space-between;align-items:center;gap:8px;min-height:64px}
#touch.show{display:flex}
#touch .grp{display:flex;gap:8px}
.tb{width:56px;height:56px;border-radius:14px;border:1.5px solid #5b5775;background:rgba(40,36,60,.8);color:var(--bone);font-size:22px;font-family:var(--font-display);touch-action:none;user-select:none;-webkit-user-select:none}
.tb.p2{border-color:#8a6a2a}

#screen{

.panel h1{font-family:var(--font-display);font-weight:400;font-size:clamp(32px,8vmin,68px);line-height:1;margin:0;letter-spacing:.02em;text-wrap:balance;text-shadow:0 3px 0 #000}
.panel h2{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,5.5vmin,44px);line-height:1.05;margin:0;text-wrap:balance}

.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{
  font-family:var(--font-display);font-size:clamp(16px,2.8vmin,21px);padding:10px 22px;background:transparent;color:var(--bone);
  border:1.5px solid var(--gold);cursor:pointer;min-width:0;
}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--ink);outline:none}
.btn.alt{border-color:#5b5775}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:104px;padding:8px 10px;background:rgba(255,255,255,.03);color:var(--bone);border:1px solid #3d3a52;cursor:pointer;font-family:var(--font-body);font-size:14px}
.chip b{font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--gold)}
.chip.sel{border-color:var(--ghost);background:rgba(159,216,230,.1)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip:focus-visible{outline:2px solid var(--ghost)}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;font-family:var(--font-mono);font-size:12px;color:#a9a4bd;text-align:left}
.keys div{border:1px solid #2e2b42;padding:8px 10px;line-height:1.55}
.keys b{display:block;color:var(--bone);font-family:var(--font-display);font-weight:400;font-size:16px;margin-bottom:2px}
.stats{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;font-family:var(--font-mono);font-size:13px;color:#b9b3cc}
.stats b{display:block;font-family:var(--font-display);font-weight:400;font-size:28px;color:var(--gold)}

/* ---------- Audio ---------- */
let AC=null,master=null,muted=false;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:0.5;master.connect(AC.destination);
    [55,82.41,110.5].forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.value=0.018-i*0.004;
      const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=0.07+i*0.03;lg.gain.value=0.008;l.connect(lg);lg.connect(g.gain);l.start();
      o.connect(g);g.connect(master);o.start();
    });
  }catch(e){AC=null}
}
function tone(f,d,type,v,slide,delay){
  if(!AC||muted)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.03);
}
function noise(d,v){
  if(!AC||muted)return;
  const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v||0.1;s.connect(g);g.connect(master);s.start();
}
const SFX={
  jump:()=>tone(330,.16,'square',.05,320),
  swing:()=>noise(.09,.06),

};

  if(d.exit.type==='boss'){
    G.boss={type:'boss',x:d.exit.x*T,y:(FLOOR)*T-76,w:50,h:76,vx:0,vy:0,hp:12+6*(mode-1),maxhp:12+6*(mode-1),dir:-1,flash:0,inv:0,stomp:false,dmg:1,state:'sleep',t:0,did:0,phase2:false,onGround:false};

}

/* ---------- Collision ---------- */
function isSolid(c,r){
  if(c<0||c>=G.cols)return r<ROWS;
  if(r<0||r>=ROWS)return false;
  return G.grid[r][c]===1;
}
function solidPx(x,y){return isSolid(Math.floor(x/T),Math.floor(y/T))}
function moveBody(e,dt){
  e.hitWall=false;
  e.x+=e.vx*dt;
  let c0=Math.floor(e.x/T),c1=Math.floor((e.x+e.w-0.01)/T),r0=Math.floor(e.y/T),r1=Math.floor((e.y+e.h-0.01)/T);
  outer:for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    if(isSolid(c,r)){
      if(e.vx>0)e.x=c*T-e.w;else if(e.vx<0)e.x=(c+1)*T;else continue;
      e.vx=0;e.hitWall=true;break outer;
    }
  }
  const prevBottom=e.y+e.h;
  e.y+=e.vy*dt;e.onGround=false;e.standing=null;
  c0=Math.floor(e.x/T);c1=Math.floor((e.x+e.w-0.01)/T);r0=Math.floor(e.y/T);r1=Math.floor((e.y+e.h-0.01)/T);
  outer2:for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    if(isSolid(c,r)){
      if(e.vy>0){e.y=r*T-e.h;e.onGround=true;e.vy=0}
      else if(e.vy<0){e.y=(r+1)*T;e.vy=0}
      else continue;
      break outer2;
    }
  }
  if(e.vy>=0){
    for(const p of G.plats){
      if(e.x+e.w>p.x+2&&e.x<p.x+p.w-2&&prevBottom<=p.y+2&&e.y+e.h>=p.y){
        e.y=p.y-e.h;e.vy=0;e.onGround=true;e.standing=p.mover?p:null;break;
      }
    }
  }
}

/* ---------- FX helpers ---------- */
function burst(x,y,n,color,sp){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(.3,1)*(sp||160);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rnd(.3,.7),max:.7,c:color,r:rnd(1.5,3.5)})}
}
function addScore(n,x,y){G.score+=n;G.pops.push({x,y,t:.9,s:'+'+n+(G.combo>1?'  x'+G.combo:'')})}
function killScore(e){
  G.combo=Math.min(5,G.combo+1);G.comboT=2.6;
  addScore(50*G.combo*(e.type==='boss'?10:1),e.x+e.w/2,e.y);G.freeze=.07;G.shake=Math.max(G.shake,.12);
  if(e.type!=='boss'&&Math.random()<(e.type==='guard'?.35:.16))G.orbs.push({x:e.x+e.w/2-8,y:e.y,w:16,h:16,vy:-220,life:12});
}
function toast(text,t){G.toasts.push({text,t:t||2.6});if(G.toasts.length>3)G.toasts.shift()}

/* ---------- Players ---------- */
function readInputs(){
  const maps=G.players.length===2?MAP2:MAP1,out=[];
  const any=(arr,set)=>arr.some(k=>set.has(k));
  for(let i=0;i<G.players.length;i++){
    const m=maps[i],t=touch[i];
    out.push({left:any(m.l,keys)||!!t.left,right:any(m.r,keys)||!!t.right,jump:any(m.j,keys)||!!t.jump,jumpP:any(m.j,pressed)||!!t.jumpP,attackP:any(m.a,pressed)||!!t.attackP});
  }
  return out;
}
function swordRect(p){const w=p.fury>0?64:36;return {x:p.face>0?p.x+p.w-2:p.x-w+2,y:p.y+(p.fury>0?-2:4),w,h:p.fury>0?44:30}}
function hurtPlayer(p,n,dirx){
  if(p.dead||p.inv>0)return;
  p.hp-=n;p.inv=1.3;p.vx=dirx*260;p.vy=-300;p.stun=.2;p.standing=null;
  SFX.hurt();burst(p.x+p.w/2,p.y+p.h/2,10,'#b02a37',180);G.shake=Math.max(G.shake,.15);
  if(p.hp<=0)killPlayer(p);
}
function killPlayer(p){
  if(p.dead)return;
  p.dead=true;p.rt=1.5;p.hp=0;G.lives--;G.deaths++;SFX.die();
  burst(p.x+p.w/2,p.y+p.h/2,24,'#e9dfc8',220);
  if(G.lives<0&&!G.over)G.over=1.4;
}
function respawn(p){
  const o=G.players.find(q=>q!==p&&!q.dead);
  let x,y;
  if(o){
    if(o.onGround&&!o.standing){x=o.x+(p.id?20:-20);y=o.y}else{x=o.safeX+(p.id?20:-20);y=o.safeY}
  }else{x=G.cp.x;y=G.cp.y;G.cam.x=clamp(x-W/2,0,G.pw-W)}
  p.x=x;p.y=y;p.vx=0;p.vy=0;p.hp=p.maxhp;p.dead=false;p.inv=2;p.stun=0;
}
function updatePlayer(p,inp,dt){
  if(p.dead){p.rt-=dt;if(p.rt<=0&&G.lives>=0&&!G.over)respawn(p);return}
  p.atkCd=Math.max(0,p.atkCd-dt);p.atkT=Math.max(0,p.atkT-dt);p.fury=Math.max(0,p.fury-dt);p.inv=Math.max(0,p.inv-dt);
  let dir=(inp.right?1:0)-(inp.left?1:0);
  if(p.stun>0){dir=0;p.stun-=dt}
  p.vx=approach(p.vx,dir*SPEED*(p.fury>0?1.18:1),(p.onGround?3200:1900)*dt);
  if(dir&&p.atkT<=0)p.face=dir;
  if(inp.jumpP)p.jb=.12;else p.jb-=dt;
  if(p.onGround)p.coy=.1;else p.coy-=dt;
  if(p.jb>0&&p.coy>0&&p.stun<=0){p.vy=-JUMP;p.jb=0;p.coy=0;p.onGround=false;p.standing=null;SFX.jump()}
  if(p.onGround)p.air2=true;
  else if(inp.jumpP&&p.coy<=0&&p.air2&&p.stun<=0){p.air2=false;p.vy=-610;p.jb=0;SFX.jump();burst(p.x+p.w/2,p.y+p.h,8,'#e9dfc8',90)}
  if(!inp.jump&&p.vy<-300)p.vy=-300;
  p.vy=Math.min(p.vy+GRAV*dt,900);
  if(p.standing)p.x+=p.standing.dx;
  moveBody(p,dt);
  for(const o of G.players){
    if(o!==p&&!o.dead&&p.vy>150&&p.x+p.w>o.x+2&&p.x<o.x+o.w-2){
      const f=p.y+p.h-o.y;
      if(f>0&&f<18&&p.y<o.y){p.vy=-650;p.y=o.y-p.h;p.air2=true;SFX.jump();burst(p.x+p.w/2,o.y,8,'#e9dfc8',90)}
    }
  }
  if(Math.abs(p.vx)>20&&p.onGround)p.anim+=dt;
  // keep inside camera (co-op tether)
  if(p.x<G.cam.x){p.x=G.cam.x;if(p.vx<0)p.vx=0}
  if(p.x+p.w>G.cam.x+W){p.x=G.cam.x+W-p.w;if(p.vx>0)p.vx=0}
  if(p.y>ROWS*T+60){killPlayer(p);return}
  if(inp.attackP&&p.atkCd<=0){p.atkT=.2;p.atkCd=p.fury>0?.22:.38;p.hit=new Set();SFX.swing()}
  for(const s of G.spikes){
    if(hit({x:p.x+4,y:p.y+p.h-10,w:p.w-8,h:10},s)){hurtPlayer(p,1,-p.face||1);p.vy=-420;break}
  }
  if(p.onGround&&!p.standing){
    const cx=p.x+p.w/2,fy=p.y+p.h+4;
    const ok=solidPx(cx-T,fy)&&solidPx(cx+T,fy)&&!G.spikes.some(s=>Math.abs(s.x+s.w/2-cx)<s.w/2+36);
    if(ok){p.safeX=p.x;p.safeY=p.y}
  }
}

/* ---------- Enemies ---------- */
function alivePlayers(){return G.players.filter(p=>!p.dead)}
function nearest(e){
  let b=null,bd=1e9;
  for(const p of alivePlayers()){const d=Math.abs(p.x-e.x)+Math.abs(p.y-e.y)*.5;if(d<bd){bd=d;b=p}}
  return b;
}
function hitEnemy(e,dmg,dirx){
  if(e.dead||e.inv>0||e.state==='dying')return;
  e.hp-=dmg;e.flash=.15;e.inv=e.type==='boss'?.25:.08;
  if(e.type==='guard'||e.type==='jester'){e.vx=dirx*190;e.kb=.2;e.vy=-170}
  burst(e.x+e.w/2,e.y+e.h/2,8,e.type==='boss'?'#d8a0ff':'#e9dfc8',150);SFX.hit();
  if(e.hp<=0){
    e.dead=true;killScore(e);burst(e.x+e.w/2,e.y+e.h/2,18,'#e9dfc8',220);
    if(e.type==='boss')bossDown();
  }
}
function bs(b,s){b.state=s;b.t=0;b.did=0}
function updateEnemy(e,dt){
  e.flash=Math.max(0,e.flash-dt);e.inv=Math.max(0,e.inv-dt);e.t+=dt;
  if(e.type==='guard'){
    if(e.kb>0){e.kb-=dt}else e.vx=e.dir*55;
    e.vy=Math.min(e.vy+GRAV*dt,900);moveBody(e,dt);
    if(e.hitWall)e.dir*=-1;
    if(e.x<e.x0)e.dir=1;if(e.x>e.x1)e.dir=-1;
    if(e.onGround&&e.kb<=0){const fx=e.dir>0?e.x+e.w+4:e.x-4;if(!solidPx(fx,e.y+e.h+4)){e.dir*=-1}}
  }else if(e.type==='jester'){
    e.vy=Math.min(e.vy+GRAV*dt,900);
    if(e.onGround){
      if(e.kb<=0)e.vx*=.8;
      if(e.t<=0||e.kb>0){}
      const p=nearest(e);
      if(p&&Math.abs(p.x-e.x)<300&&e.kb<=0&&e.t>1.1){e.t=0;e.dir=p.x>e.x?1:-1;e.vx=e.dir*140;e.vy=-460}
    }
    if(e.kb>0)e.kb-=dt;
    moveBody(e,dt);
    if(e.y>ROWS*T+60)e.dead=true;
  }else if(e.type==='wisp'){
    e.x+=e.dir*42*dt;if(e.x>e.bx+e.range)e.dir=-1;if(e.x<e.bx-e.range)e.dir=1;
    e.y=e.by+Math.sin(e.t*2.2)*14;
  }else if(e.type==='shade'){
    const p=nearest(e);
    if(!e.active){if(p&&Math.abs(p.x-e.x)<340)e.active=true}
    else if(p){
      const dx=p.x+p.w/2-e.x-e.w/2,dy=p.y+p.h/2-e.y-e.h/2,d=Math.hypot(dx,dy)||1;
      e.x+=dx/d*78*dt;e.y+=dy/d*78*dt;
    }
    e.bob=Math.sin(e.t*3)*3;
  }else if(e.type==='boss')updateBoss(e,dt);
}
function throwChalice(b,p){
  const sx=b.x+b.w/2,sy=b.y+10,tx=p.x+p.w/2,t=.9;
  G.proj.push({type:'chalice',x:sx,y:sy,w:16,h:16,vx:(tx-sx)/t,vy:-380,life:3});SFX.boss();
}
function updateBoss(b,dt){
  const p=nearest(b);
  if(b.state==='sleep'||b.state==='enter'||b.state==='dying'){
    b.vy=Math.min(b.vy+GRAV*dt,900);b.vx=0;moveBody(b,dt);
    if(b.state==='dying'&&b.t>2)b.dead=true;
    return;
  }
  if(!b.phase2&&b.hp<=b.maxhp/2){
    b.phase2=true;toast('Claudius grows desperate.',2.4);SFX.boss();
    for(let k=0;k<2;k++)G.enemies.push({type:'shade',x:G.cam.x+(k?W-60:30),y:80,w:26,h:34,vx:0,vy:0,hp:1,flash:0,inv:0,stomp:false,dmg:1,active:true,t:0});
  }
  const sp=b.phase2?1.25:1;
  if(p)b.dir=p.x+p.w/2>b.x+b.w/2?1:-1;
  b.vy=Math.min(b.vy+GRAV*dt,900);
  switch(b.state){
    case 'walk':
      b.vx=b.dir*70*sp;
      if(b.t>1.2/sp){
        const r=Math.random();
        if(r<.4)bs(b,'tele');else if(r<.7)bs(b,'toss');else bs(b,'slam');
      }break;
    case 'tele':b.vx=0;if(b.t>.7/sp){bs(b,'charge');b.cdir=b.dir}break;
    case 'charge':b.vx=b.cdir*390*sp;if(b.t>.9||b.hitWall){bs(b,'recover')}break;
    case 'recover':b.vx=0;if(b.t>.9/sp)bs(b,'walk');break;
    case 'toss':
      b.vx=0;
      if(p&&b.did<3&&b.t>.4+b.did*.45){b.did++;throwChalice(b,p)}
      if(b.t>1.9/sp)bs(b,'walk');break;
    case 'slam':
      b.vx=0;
      if(b.did===0&&b.t>.35){b.vy=-740;b.did=1}
      if(b.did===1&&b.t>.6&&b.onGround){
        b.did=2;G.shake=.45;SFX.boss();
        G.proj.push({type:'wave',x:b.x-20,y:FLOOR*T-24,w:30,h:24,vx:-270,vy:0,life:2.6});
        G.proj.push({type:'wave',x:b.x+b.w-10,y:FLOOR*T-24,w:30,h:24,vx:270,vy:0,life:2.6});
        bs(b,'recover');
      }break;
  }
  moveBody(b,dt);
  b.x=clamp(b.x,G.cam.x+8,G.cam.x+W-8-b.w);
}
function bossDown(){
  const b=G.boss;bs(b,'dying');b.dead=false;b.hp=0;b.vx=0;
  G.enemies=G.enemies.filter(e=>e===b);G.proj.length=0;
  burst(b.x+b.w/2,b.y+b.h/2,40,'#d8a0ff',300);G.shake=.8;SFX.boss();
  b.finishing=true;
}
function updateProj(dt){
  for(const q of G.proj){
    q.life-=dt;q.x+=q.vx*dt;
    if(q.type==='chalice'){q.vy+=GRAV*.9*dt;q.y+=q.vy*dt;if(q.y>FLOOR*T-12){q.life=0;burst(q.x,q.y,10,'#9be86a',140)}}
    for(const p of alivePlayers())if(hit({x:p.x+3,y:p.y+4,w:p.w-6,h:p.h-4},q)){hurtPlayer(p,1,q.vx>0?1:-1);q.life=0;burst(q.x,q.y,8,'#9be86a',120)}
  }
  G.proj=G.proj.filter(q=>q.life>0);
}
function enemyPlayerInteractions(dt){
  for(const e of G.enemies){
    if(e.dead||(e.type==='shade'&&!e.active))continue;
    for(const p of alivePlayers()){
      if(p.atkT>0&&!p.hit.has(e)&&hit(swordRect(p),e)){p.hit.add(e);hitEnemy(e,1,p.face)}
      if(e.dead)break;
      if(e.type==='boss'&&(e.state==='sleep'||e.state==='enter'||e.state==='dying'))continue;
      const pb={x:p.x+3,y:p.y+4,w:p.w-6,h:p.h-4};
      if(hit(pb,e)){
        if(e.stomp&&p.vy>120&&p.y+p.h-e.y<22){hitEnemy(e,1,p.face);p.vy=-480}
        else if(p.inv<=0)hurtPlayer(p,e.dmg,(p.x+p.w/2<e.x+e.w/2)?-1:1);
      }
    }
  }
  G.enemies=G.enemies.filter(e=>!e.dead);
}

   <div class="stats"><div><b>${run.score}</b>final score</div><div><b>${best}</b>best score</div><div><b>${run.clues}</b>clues &amp; flowers</div><div><b>${fmt(run.time)}</b>total time</div><div><b>${run.deaths}</b>falls</div></div>
   <div class="row"><button class="btn" data-act="again">Play again</button><button class="btn alt" data-act="menu">Menu</button></div></div>`);

}
function showGameOver(){
  state='over';
  showScreen(`<div class="panel"><div class="eyebrow">The curtain falls</div><h2>Fate has closed the book</h2>
   <p>All five lives are spent. The tale can be told again from the start of this act.</p>
   <div class="row"><button class="btn" data-act="retry">Try again</button><button class="btn alt" data-act="menu">Menu</button></div></div>`);
  defaultAct=['retry'];

function pauseGame(){
  if(state!=='play')return;

/* ---------- World update ---------- */
function allClues(){return G.got>=G.clues.length}
function update(dt){
  if(G.freeze>0){G.freeze-=dt;return}
  G.t+=dt;G.comboT-=dt;if(G.comboT<=0)G.combo=0;G.shake=Math.max(0,G.shake-dt);G.hintCool=Math.max(0,G.hintCool-dt);
  for(const m of G.movers){
    const ox=m.x;m.ph+=dt*Math.PI*m.sp/m.range;
    m.x=m.x0+m.range*(0.5-0.5*Math.cos(m.ph));m.dx=m.x-ox;
  }
  const ins=readInputs();
  G.players.forEach((p,i)=>updatePlayer(p,ins[i],dt));
  for(const e of G.enemies)updateEnemy(e,dt);
  enemyPlayerInteractions(dt);
  updateProj(dt);
  const alive=alivePlayers();
  // camera
  let tx;
  if(G.arena)tx=G.pw-W;
  else if(alive.length){tx=alive.reduce((s,p)=>s+p.x+p.w/2,0)/alive.length-W/2+(alive[0].face||1)*40}
  else tx=G.cam.x;
  tx=clamp(tx,0,G.pw-W);
  G.cam.x+=(tx-G.cam.x)*Math.min(1,(G.arena?3:6)*dt);
  // pickups
  for(const p of alive){
    const pb={x:p.x-4,y:p.y-4,w:p.w+8,h:p.h+8};
    for(const c of G.clues)if(!c.got&&hit(pb,c)){
      c.got=true;G.got++;addScore(100,c.x,c.y);SFX.clue();burst(c.x+10,c.y+10,14,'#e0a83a',150);
      const tx=G.d.clueText[c.k];toast(`${tx[0]}: ${tx[1]}`,4.2);
      if(allClues()&&!G.d.optional){toast(G.d.exit.type==='stage'?'All pages found. Take the stage.':G.d.exit.type==='door'?'All clues found. The door is open.':'All clues found. Find the spectre.',3.4);if(G.door)SFX.door()}
    }
    for(const c of G.coins)if(!c.got&&hit(pb,c)){c.got=true;G.score+=10;SFX.coin();burst(c.x+6,c.y+6,4,'#ffd060',70)}
    for(const o of G.orbs)if(o.life>0&&hit(pb,o)){o.life=0;p.fury=8;SFX.heart();toast(p.name+' is filled with fury: faster, wider strikes.',2.2);burst(o.x+8,o.y+8,14,'#ff8a3a',160)}
    for(const h of G.hearts)if(!h.got&&p.hp<p.maxhp&&hit(pb,h)){h.got=true;p.hp++;SFX.heart();burst(h.x+10,h.y+10,10,'#e0475a',120)}
    for(const k of G.checks)if(!k.on&&Math.abs(p.x-k.x)<40&&Math.abs(p.y-k.y)<80){
      k.on=true;G.cp={x:k.sx,y:k.sy};SFX.check();toast('Torch lit. You will return here.',1.8);burst(k.x+16,k.y+10,10,'#ffb040',120);
    }
  }
  // exits
  if(!G.exiting){
    const ex=G.d.exit;
    if(ex.type==='door'){
      for(const p of alive)if(hit(p,G.door)){
        if(allClues()){G.exiting=true;SFX.door();say(D.l2_end,completeLevel)}
        else if(G.hintCool<=0){G.hintCool=3;toast(`Locked. Clues found: ${G.got}/${G.clues.length}.`)}
        break;
      }
    }else if(ex.type==='ghost'){
      for(const p of alive)if(Math.abs(p.x-G.ghost.x)<110&&Math.abs(p.y-G.ghost.y)<200){
        if(allClues()){G.exiting=true;say(D.l1_ghost,()=>{G.ghostFade=1.6;setTimeout(()=>{if(G&&G.i===0&&state==='play')completeLevel()},1600)})}
        else if(G.hintCool<=0){G.hintCool=3;toast(`The spectre waits. Clues found: ${G.got}/${G.clues.length}.`)}
        break;
      }
    }
  }
  if(G.ghostFade>0)G.ghostFade-=dt;
  // stage event
  const ev=G.ev;
  if(ev&&!ev.done){
    if(!ev.active){
      const inZ=alive.some(p=>hit(p,ev.zone));
      if(inZ){
        if(allClues()){ev.active=true;ev.spawnT=1.5;say(D.l3_start,null)}
        else if(G.hintCool<=0){G.hintCool=3.5;toast(`The players still need their pages: ${G.got}/${G.clues.length}.`)}
      }
    }else{
      ev.guilt+=dt/24;ev.spawnT-=dt;
      if(ev.spawnT<=0&&G.enemies.filter(e=>e.type==='jester'||e.type==='guard').length<5){
        ev.spawnT=3;const left=Math.random()<.5,sx=left?101:121;
        G.enemies.push({type:'jester',x:sx*T,y:FLOOR*T-34,w:22,h:34,vx:0,vy:0,hp:1,dir:1,flash:0,inv:0,kb:0,stomp:true,dmg:1,t:0});
      }
      if(ev.guilt>=1){
        ev.guilt=1;ev.active=false;ev.done=true;G.exiting=true;
        G.enemies=G.enemies.filter(e=>e.type==='wisp');G.proj.length=0;
        say(D.l3_end,completeLevel);
      }
    }
  }
  // boss arena
  if(G.boss&&!G.arena&&G.boss.state==='sleep'&&alive.some(p=>p.x>G.d.arenaTrigger*T)){
    G.arena=true;G.boss.state='enter';
    say(D.l4_boss,()=>{bs(G.boss,'walk');toast('Strike Claudius until he falls.',2.6)});
  }
  if(G.boss&&G.boss.state==='dying'&&G.boss.dead&&!G.exiting){G.exiting=true;say(D.l4_end,showEnding)}
  if(G.boss&&G.boss.state==='dying')G.enemies=G.enemies.filter(e=>!e.dead||e===G.boss);
  // particles / toasts
  for(const q of G.parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt}
  G.parts=G.parts.filter(q=>q.life>0);
  for(const o of G.orbs){o.life-=dt;o.vy+=GRAV*dt;o.y+=o.vy*dt;if(solidPx(o.x+8,o.y+o.h)){o.y=Math.floor((o.y+o.h)/T)*T-o.h;o.vy=0}}
  G.orbs=G.orbs.filter(o=>o.life>0&&o.y<ROWS*T+40);
  for(const q of G.pops){q.t-=dt;q.y-=42*dt}
  G.pops=G.pops.filter(q=>q.t>0);
  for(const t of G.toasts)t.t-=dt;
  G.toasts=G.toasts.filter(t=>t.t>0);
  if(G.over>0){G.over-=dt;if(G.over<=0)showGameOver()}
}

let tileCache=null;

function buildTiles(th){

      f.fillStyle='rgba(150,175,215,.32)';f.beginPath();f.moveTo(x+8,330);f.lineTo(x+8,150);f.arc(x+50,150,42,Math.PI,0);f.lineTo(x+92,330);f.fill();

      n.strokeStyle='#e0a83a';n.lineWidth=3;n.strokeRect(x+216,36,58,170);

    }

/* ---------- Rendering ---------- */
const DISP='"IM Fell English SC",Georgia,serif',BODY='"Crimson Pro",Georgia,serif',MONO='"Spline Sans Mono",ui-monospace,monospace';
function txt(s,x,y,font,col,al){ctx.font=font;ctx.textAlign=al||'left';ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillText(s,x+1.5,y+1.5);ctx.fillStyle=col;ctx.fillText(s,x,y)}
function heart(x,y,s,col){
  ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(x,y+s*.35);ctx.bezierCurveTo(x,y-s*.1,x-s*.55,y-s*.1,x-s*.55,y+s*.3);
  ctx.bezierCurveTo(x-s*.55,y+s*.6,x,y+s*.85,x,y+s);
  ctx.bezierCurveTo(x,y+s*.85,x+s*.55,y+s*.6,x+s*.55,y+s*.3);
  ctx.bezierCurveTo(x+s*.55,y-s*.1,x,y-s*.1,x,y+s*.35);ctx.fill();
}
function wrap(s,maxW,font){
  ctx.font=font;const words=s.split(' '),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);return lines;
}
function glow(x,y,r,rgb,a){

  ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
}
function drawLayer(img,f){const x=-((G.cam.x*f)%BGW);ctx.drawImage(img,x,0);ctx.drawImage(img,x+BGW,0)}
function torch(x,y){
  const fl=Math.sin(now*11+x)*.15+Math.sin(now*17+x*2)*.1;
  ctx.fillStyle='#3a2a1c';ctx.fillRect(x-3,y,6,20);ctx.fillStyle='#5a4128';ctx.fillRect(x-7,y-2,14,5);
  ctx.save();ctx.globalCompositeOperation='lighter';glow(x,y-8,90+fl*40,'255,150,50',.32+fl*.2);ctx.restore();
  ctx.fillStyle='#ffb040';ctx.beginPath();ctx.moveTo(x-5,y-2);ctx.quadraticCurveTo(x-6,y-14,x,y-22-fl*18);ctx.quadraticCurveTo(x+6,y-14,x+5,y-2);ctx.fill();
  ctx.fillStyle='#fff0b0';ctx.beginPath();ctx.ellipse(x,y-6,2.5,5,0,0,6.3);ctx.fill();
}
function drawBackground(){
  const th=G.theme,g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  }

function drawWorld(){

/* ---------- Touch controls ---------- */
const touchBar=$('touch'),legend=$('legend'),frame=$('frame');
let isTouch=false;
function bindBtn(el,pi,key){
  const set=v=>{
    const t=touch[pi];
    if(key==='left')t.left=v;else if(key==='right')t.right=v;
    else if(key==='jump'){if(v&&!t.jump)t.jumpP=true;t.jump=v}
    else if(key==='attack'){if(v)t.attackP=true}
    el.classList.toggle('on',!!v);
  };
  el.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{el.setPointerCapture(e.pointerId)}catch(_){}set(1)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>set(0)));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
function buildTouch(){
  if(!isTouch)return;
  touchBar.innerHTML='';touchBar.classList.add('show');
  const mk=(label,pi,key,cls)=>{const b=document.createElement('button');b.className='tb'+(cls?' '+cls:'');b.textContent=label;b.setAttribute('aria-label',key);bindBtn(b,pi,key);return b};
  const g1=document.createElement('div'),g2=document.createElement('div');g1.className=g2.className='grp';
  if(mode===2){
    g1.append(mk('◀',0,'left'),mk('▶',0,'right'),mk('▲',0,'jump'),mk('⚔',0,'attack'));
    g2.append(mk('◀',1,'left','p2'),mk('▶',1,'right','p2'),mk('▲',1,'jump','p2'),mk('⚔',1,'attack','p2'));
  }else{
    g1.append(mk('◀',0,'left'),mk('▶',0,'right'));
    g2.append(mk('▲',0,'jump'),mk('⚔',0,'attack'));
  }
  touchBar.append(g1,g2);fit();
}
function fit(){
  const wrapEl=$('stagewrap'),aw=wrapEl.clientWidth,ah=wrapEl.clientHeight;
  const s=Math.max(.2,Math.min(aw/W,ah/H));
  frame.style.width=Math.floor(W*s)+'px';frame.style.height=Math.floor(H*s)+'px';
}

/* ---------- Events ---------- */
addEventListener('keydown',e=>{
  initAudio();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(!e.repeat)pressed.add(e.code);
  keys.add(e.code);
  if(e.repeat)return;
  if(e.code==='KeyM'){muted=!muted;if(master)master.gain.value=muted?0:.5}
  if(state==='play'&&(e.code==='KeyP'||e.code==='Escape'))pauseGame();
  else if(state==='paused'&&(e.code==='KeyP'||e.code==='Escape'))act('resume');
  else if(scr.classList.contains('show')){
    if(state==='menu'){if(e.code==='Digit1')act('start',1);else if(e.code==='Digit2')act('start',2);else if(e.code==='Enter'&&defaultAct)act(...defaultAct)}
    else if(e.code==='Enter'&&defaultAct)act(...defaultAct);
  }
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>{keys.clear();if(state==='play')pauseGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame()});
addEventListener('resize',fit);
cv.addEventListener('pointerdown',e=>{
  initAudio();
  if(e.pointerType==='touch'||e.pointerType==='pen'){if(!isTouch){isTouch=true;legend.style.display='none';buildTouch()}}
  if(state==='dialogue'||state==='card')pressed.add('Enter');
});
addEventListener('touchstart',()=>{if(!isTouch){isTouch=true;legend.style.display='none';buildTouch();fit()}},{passive:true,once:true});

/* ---------- Main loop ---------- */
let last=0;
function step(dt){
  if(!G)return;
  if(state==='menu'){G.t+=dt;G.cam.x=(G.cam.x+dt*30)%(Math.max(1,G.pw-W));return}
  if(state==='card'){card.t+=dt;if(card.t>.6&&(pressed.size>0||card.t>5))startPlay();return}
  if(state==='dialogue'){updateDialogue(dt);return}
  if(state==='play'){update(dt)}
}
function frameLoop(t){
  const dt=Math.min(.033,Math.max(0,(t-last)/1000));last=t;now=t/1000;
  try{step(dt);render()}catch(err){console.error(err)}
  pressed.clear();
  for(const tt of touch){tt.jumpP=0;tt.attackP=0}
  requestAnimationFrame(frameLoop);
}
if(typeof window!=='undefined'&&window.__ROTP_TEST)window.__ROTP_TEST({loadLevel,update,render,step,keys,pressed,act,get G(){return G},set mode(v){mode=v},get state(){return state},set state(v){state=v},readInputs,startPlay,D});
fit();
try{document.fonts&&document.fonts.load('20px "IM Fell English SC"')}catch(e){}
toMenu();
requestAnimationFrame(frameLoop);
})();
</script>
